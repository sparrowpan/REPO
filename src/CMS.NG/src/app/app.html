<div class="layout" [class.layout--collapsed]="collapsed()">
  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar__left">
      <button type="button" class="topbar__toggle" (click)="toggleCollapse()" aria-label="Toggle menu">
        <i class="pi pi-bars"></i>
      </button>
      <a class="topbar__brand" routerLink="/app-roles">
        <span class="topbar__logo">U</span>
        <span class="topbar__brand-text">UWA</span>
      </a>
    </div>
    <div class="topbar__right">
      <button type="button" class="topbar__action" aria-label="Search"><i class="pi pi-search"></i></button>
      <button type="button" class="topbar__action" aria-label="Settings"><i class="pi pi-cog"></i></button>
      <button type="button" class="topbar__action topbar__avatar" aria-label="Profile"><i class="pi pi-user"></i></button>
    </div>
  </header>

  <div class="layout__body">
    <!-- Sidebar -->
    <aside class="sidebar">
      <nav class="sidebar__nav">
        @for (section of navSections; track section.title) {
          <div class="menu-section">
            <span class="menu-section__title">{{ section.title }}</span>

            @for (group of section.groups; track group.label) {
              <div class="nav-group">
                <button type="button" class="nav-item nav-item--parent" (click)="toggleGroup(group.label)"
                        [class.nav-item--open]="isExpanded(group.label)">
                  <i class="nav-item__icon" [class]="group.icon"></i>
                  <span class="nav-item__label">{{ group.label }}</span>
                  @if (group.children.length) {
                    <i class="nav-item__chevron pi pi-angle-down"></i>
                  }
                </button>

                @if (group.children.length && isExpanded(group.label)) {
                  <div class="nav-submenu">
                    @for (child of group.children; track child.route) {
                      <a class="nav-item nav-item--child" [routerLink]="child.route"
                         routerLinkActive="nav-item--active">
                        <i class="nav-item__icon" [class]="child.icon"></i>
                        <span class="nav-item__label">{{ child.label }}</span>
                      </a>
                    }
                  </div>
                }
              </div>
            }
          </div>
        }
      </nav>
    </aside>

    <!-- Content -->
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
