<p-toast />

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-card page-header">
    <div class="page-header__title">
      <h2>{{ isEdit() ? '編輯發布狀態' : '新增發布狀態' }}</h2>
    </div>
    <div class="page-header__actions">
      <row-audit-badge tableName="PublishStatus" [pkid]="auditPkid()" />
      <button pButton type="button" class="p-button-outlined p-button-secondary" (click)="cancel()">
        <i class="pi pi-times"></i>&nbsp;取消
      </button>
      <button pButton type="submit" class="p-button-success" [disabled]="saving()">
        <i class="pi pi-check"></i>&nbsp;儲存
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="page-card">載入中…</div>
  } @else {
    <div class="page-card">
      <h3 class="section-title">發布狀態資料</h3>

      <div class="form-field">
        <label for="pkid">主代碼 <span class="req">*</span></label>
        <p-inputNumber inputId="pkid" formControlName="pkid" [useGrouping]="false" [min]="0" [max]="255"
                       placeholder="請輸入主代碼（0–255）" />
        @if (form.controls.pkid.invalid && form.controls.pkid.touched) {
          <small class="err">主代碼為必填。</small>
        }
      </div>

      <div class="form-field">
        <label for="description">狀態說明 <span class="req">*</span></label>
        <input pInputText id="description" formControlName="description" maxlength="50" />
        @if (form.controls.description.invalid && form.controls.description.touched) {
          <small class="err">狀態說明為必填。</small>
        }
      </div>

      <div class="form-field form-field--check">
        <p-checkbox inputId="isDraft" formControlName="isDraft" [binary]="true" />
        <label for="isDraft">草稿</label>
      </div>

      <div class="form-field form-field--check">
        <p-checkbox inputId="isPublished" formControlName="isPublished" [binary]="true" />
        <label for="isPublished">已發布</label>
      </div>

      <div class="form-field form-field--check">
        <p-checkbox inputId="isDiscontinued" formControlName="isDiscontinued" [binary]="true" />
        <label for="isDiscontinued">已停用</label>
      </div>
    </div>
  }
</form>
