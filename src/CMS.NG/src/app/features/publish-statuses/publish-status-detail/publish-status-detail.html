<p-toast />

<div class="page-card page-header">
  <div class="page-header__title">
    <h2>檢視發布狀態</h2>
    @if (status(); as s) {
      <span class="page-header__subtitle">{{ s.description }}</span>
    }
  </div>
  <div class="page-header__actions">
    <row-audit-badge tableName="PublishStatus" [pkid]="status()?.pkid ?? 0" />
    <button pButton type="button" class="p-button-outlined p-button-secondary" (click)="back()">
      <i class="pi pi-arrow-left"></i>&nbsp;返回
    </button>
    <button pButton type="button" class="p-button-success" (click)="edit()" [disabled]="!status()">
      <i class="pi pi-pencil"></i>&nbsp;編輯
    </button>
  </div>
</div>

@if (loading()) {
  <div class="page-card">載入中…</div>
} @else if (status(); as s) {
  <div class="page-card">
    <h3 class="section-title">發布狀態資料</h3>
    <dl class="detail-grid">
      <div class="detail-item"><dt>主代碼</dt><dd>{{ s.pkid }}</dd></div>
      <div class="detail-item detail-item--wide"><dt>狀態說明</dt><dd>{{ s.description }}</dd></div>
      <div class="detail-item">
        <dt>草稿</dt>
        <dd>
          @if (s.isDraft) { <p-tag value="是" severity="info" /> } @else { <span class="muted">否</span> }
        </dd>
      </div>
      <div class="detail-item">
        <dt>已發布</dt>
        <dd>
          @if (s.isPublished) { <p-tag value="是" severity="success" /> } @else { <span class="muted">否</span> }
        </dd>
      </div>
      <div class="detail-item">
        <dt>已停用</dt>
        <dd>
          @if (s.isDiscontinued) { <p-tag value="是" severity="danger" /> } @else { <span class="muted">否</span> }
        </dd>
      </div>
    </dl>
  </div>
}
