<p-toast />
<p-confirmDialog />

<div class="page-card page-header">
  <div class="page-header__title">
    <h2>合作廠商 Partner</h2>
    <span class="page-header__subtitle">課程合作廠商</span>
  </div>
  <div class="page-header__actions">
    <button pButton type="button" class="p-button-outlined p-button-secondary" (click)="filterVisible.set(true)">
      <i class="pi pi-filter"></i>&nbsp;搜尋條件
    </button>
    <button pButton type="button" class="p-button-success" (click)="add()">
      <i class="pi pi-plus"></i>&nbsp;新增
    </button>
  </div>
</div>

<div class="page-card">
  <p-table
    [value]="partners()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    dataKey="pkid"
    styleClass="p-datatable-striped p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="pkid" style="width: 7rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="name">廠商名稱 <p-sortIcon field="name" /></th>
        <th pSortableColumn="appKey" style="width: 9rem">廠商代碼 <p-sortIcon field="appKey" /></th>
        <th pSortableColumn="nameOnPartnerMenu">選單顯示名稱 <p-sortIcon field="nameOnPartnerMenu" /></th>
        <th pSortableColumn="nameOnCourseDetailPage">課程頁顯示名稱 <p-sortIcon field="nameOnCourseDetailPage" /></th>
        <th pSortableColumn="displayOrder" style="width: 8rem">顯示順序 <p-sortIcon field="displayOrder" /></th>
        <th style="width: 10rem">操作</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-partner>
      <tr>
        <td>{{ partner.pkid }}</td>
        <td><a [routerLink]="['/partners', partner.pkid]" class="link">{{ partner.name }}</a></td>
        <td>{{ partner.appKey }}</td>
        <td>{{ partner.nameOnPartnerMenu }}</td>
        <td>{{ partner.nameOnCourseDetailPage }}</td>
        <td>{{ partner.displayOrder }}</td>
        <td>
          <div class="row-actions">
            <button pButton type="button" class="p-button-text p-button-rounded" pTooltip="檢視"
                    (click)="view(partner)"><i class="pi pi-eye"></i></button>
            <button pButton type="button" class="p-button-text p-button-rounded" pTooltip="編輯"
                    (click)="edit(partner)"><i class="pi pi-pencil"></i></button>
            <button pButton type="button" class="p-button-text p-button-rounded p-button-danger" pTooltip="刪除"
                    (click)="confirmDelete(partner)"><i class="pi pi-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Filter drawer -->
<p-drawer [visible]="filterVisible()" (visibleChange)="filterVisible.set($event)" header="搜尋條件" position="right" [style]="{ width: '360px' }">
  <div class="filter-form">
    <div class="filter-field">
      <label for="keyword">關鍵字</label>
      <input pInputText id="keyword" [(ngModel)]="filters.keyword" placeholder="名稱／代碼／顯示名稱" />
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="filter-footer">
      <button pButton type="button" class="p-button-text" (click)="clearFilters()">清除</button>
      <button pButton type="button" (click)="applyFilters()">套用</button>
    </div>
  </ng-template>
</p-drawer>
