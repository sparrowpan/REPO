<p-toast />
<p-confirmDialog />

<div class="page-card page-header">
  <div class="page-header__title">
    <h2>課程群組 CourseGroup</h2>
    <span class="page-header__subtitle">課程分類群組</span>
  </div>
  <div class="page-header__actions">
    <button pButton type="button" class="p-button-outlined p-button-secondary" (click)="filterVisible.set(true)">
      <i class="pi pi-filter"></i>&nbsp;搜尋條件
    </button>
    <button pButton type="button" class="p-button-success" (click)="add()">
      <i class="pi pi-plus"></i>&nbsp;新增
    </button>
  </div>
</div>

<div class="page-card">
  <p-table
    [value]="courseGroups()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    dataKey="pkid"
    styleClass="p-datatable-striped p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="pkid" style="width: 8rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">群組名稱 <p-sortIcon field="description" /></th>
        <th style="width: 10rem">操作</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-courseGroup>
      <tr>
        <td>{{ courseGroup.pkid }}</td>
        <td><a [routerLink]="['/course-groups', courseGroup.pkid]" class="link">{{ courseGroup.description }}</a></td>
        <td>
          <div class="row-actions">
            <button pButton type="button" class="p-button-text p-button-rounded" pTooltip="檢視"
                    (click)="view(courseGroup)"><i class="pi pi-eye"></i></button>
            <button pButton type="button" class="p-button-text p-button-rounded" pTooltip="編輯"
                    (click)="edit(courseGroup)"><i class="pi pi-pencil"></i></button>
            <button pButton type="button" class="p-button-text p-button-rounded p-button-danger" pTooltip="刪除"
                    (click)="confirmDelete(courseGroup)"><i class="pi pi-trash"></i></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Filter drawer -->
<p-drawer [visible]="filterVisible()" (visibleChange)="filterVisible.set($event)" header="搜尋條件" position="right" [style]="{ width: '360px' }">
  <div class="filter-form">
    <div class="filter-field">
      <label for="keyword">關鍵字</label>
      <input pInputText id="keyword" [(ngModel)]="filters.keyword" placeholder="群組名稱" />
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="filter-footer">
      <button pButton type="button" class="p-button-text" (click)="clearFilters()">清除</button>
      <button pButton type="button" (click)="applyFilters()">套用</button>
    </div>
  </ng-template>
</p-drawer>
